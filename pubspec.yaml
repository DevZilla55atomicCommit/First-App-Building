name: first_app_building
description: "A demonstration Flutter app for learning iOS app development with clean architecture"
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.1.0
  # Networking
  dio: ^5.4.3+1
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  # Local storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.2
  freezed: ^2.4.5
  json_serializable: ^6.8.0
  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/